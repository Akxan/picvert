[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picvert"
version = "1.1.0"
description = "Batch image / PDF / document format converter with a Tkinter GUI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Julio (Akxan)" }]
license = { text = "Apache-2.0" }
keywords = ["image", "converter", "pdf", "heic", "tkinter", "gui"]
dependencies = [
    "Pillow>=10.0",
    "tkinterdnd2>=0.4.3",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow-heif>=0.18",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.6"]

[project.scripts]
picvert = "picvert.__main__:main"

[tool.setuptools.packages.find]
include = ["picvert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:fitz",
]
