[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picvert"
version = "1.2.0"
description = "Batch image / PDF / document converter — Python sidecar for the Tauri desktop shell"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Julio (Akxan)" }]
license = { text = "Apache-2.0" }
keywords = ["image", "converter", "pdf", "heic", "office", "tauri"]
dependencies = [
    "Pillow>=10.0",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow-heif>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.6"]

[project.scripts]
picvert-engine = "picvert.cli:main"

[tool.setuptools.packages.find]
include = ["picvert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:fitz",
]
