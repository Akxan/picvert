name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14            # arm64
            target: aarch64-apple-darwin
            host_python: "3.12"
          - os: macos-13            # intel x86_64
            target: x86_64-apple-darwin
            host_python: "3.12"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            host_python: "3.12"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ─────────────────── Python sidecar build ───────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.host_python }}

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Python tests
        shell: bash
        run: pytest -q

      - name: Build picvert-engine binary (--onedir)
        shell: bash
        run: |
          # Builds dist/picvert-engine/  (folder layout — Tauri picks it up
          # from tauri.conf.json `bundle.resources`).
          python -m PyInstaller engine.spec --clean --noconfirm
          ls -la dist/picvert-engine | head

      # ─────────────────── Rust + Tauri build ───────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      # On macOS, import the Developer ID Application certificate from a
      # base64-encoded .p12 stored in repo secrets so cargo tauri build
      # can codesign + notarize. No-op on Windows / Linux runners.
      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/picvert-build.keychain-db
          KEYCHAIN_PWD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          # Make the build keychain the default search target.
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          # Verify codesign sees a usable Developer ID Application identity,
          # then export its SHA-1 — used as APPLE_SIGNING_IDENTITY in the
          # build step below. Bypasses any whitespace/encoding issues in
          # the secret value (codesign is picky about exact string match).
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          APPLE_ID_SHA=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$APPLE_ID_SHA" ]; then
            echo "::error::Developer ID Application identity not found in build keychain"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$APPLE_ID_SHA" >> $GITHUB_ENV

      # Tauri's bundler only signs Contents/MacOS/picvert. The PyInstaller
      # sidecar in Resources/engine ships dozens of Mach-O .so/.dylib files
      # — notarization rejects the .app unless every Mach-O inside it is
      # signed with the Developer ID + hardened runtime + secure timestamp.
      - name: Sign Python sidecar binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          SIDECAR_DIR=dist/picvert-engine
          # Python interpreter needs these entitlements under hardened runtime:
          # cffi/etc allocate executable memory; .so plugins are signed
          # separately so library validation must be relaxed.
          ENT="$RUNNER_TEMP/picvert-engine.entitlements"
          cat > "$ENT" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict>
          </plist>
          EOF
          SIGN_ARGS=(--force --options runtime --timestamp --entitlements "$ENT" \
                     --sign "$APPLE_SIGNING_IDENTITY")
          # Sign from inside out:
          # Pass 1 — every Mach-O INSIDE frameworks (includes the framework's
          #          main binary at Versions/X/Python).
          inside=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O"; then
              codesign "${SIGN_ARGS[@]}" "$f"
              inside=$((inside + 1))
            fi
          done < <(find "$SIDECAR_DIR" -path "*.framework/*" -type f -print0)
          # Pass 2 — every Mach-O OUTSIDE any framework.
          loose=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O"; then
              codesign "${SIGN_ARGS[@]}" "$f"
              loose=$((loose + 1))
            fi
          done < <(find "$SIDECAR_DIR" -type f -not -path "*.framework/*" -print0)
          # Pass 3 — each .framework bundle as a unit (seals Resources/Info.plist).
          fw=0
          while IFS= read -r -d '' d; do
            codesign "${SIGN_ARGS[@]}" "$d"
            fw=$((fw + 1))
          done < <(find "$SIDECAR_DIR" -type d -name "*.framework" -print0)
          echo "Signed: $inside inside framework + $loose loose + $fw frameworks"
          codesign -dv --verbose=2 "$SIDECAR_DIR/picvert-engine" 2>&1 | head -10

      - name: Build Tauri bundle
        env:
          # Updater signing (already wired in v1.1).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code-sign + notarization. Tauri 2 reads these env vars
          # automatically when the keychain has the matching identity.
          # APPLE_SIGNING_IDENTITY is set in the import step (SHA-1 from
          # keychain) and inherited via $GITHUB_ENV — don't override here.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p _release
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg _release/ || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz _release/ || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig _release/ || true
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi _release/ || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe _release/ || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig _release/ || true
          fi
          ls -la _release

      - uses: actions/upload-artifact@v4
        with:
          name: picvert-${{ matrix.target }}
          path: _release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Generate latest.json (Tauri updater manifest)
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${TAG#v}"
          owner_repo="${{ github.repository }}"
          base="https://github.com/${owner_repo}/releases/download/${TAG}"
          notes=$(git log -1 --pretty=%B "$TAG" || echo "Release $TAG")

          # Tauri's updater format: per-platform URL + signature.
          # Sigs are produced by `cargo tauri build` next to each artifact.
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base "$base" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {}
            }' > latest.json

          # Helper to append a platform entry from the matching .sig file.
          add_platform() {
            local key="$1"
            local sig_file="$2"
            local pkg_file="$3"
            if [ -f "$sig_file" ] && [ -f "$pkg_file" ]; then
              sig=$(cat "$sig_file")
              pkg_name=$(basename "$pkg_file")
              jq --arg key "$key" \
                 --arg sig "$sig" \
                 --arg url "$base/$pkg_name" \
                 '.platforms[$key] = {signature: $sig, url: $url}' \
                 latest.json > latest.json.tmp && mv latest.json.tmp latest.json
            fi
          }

          shopt -s nullglob
          for sig in _artifacts/picvert-aarch64-apple-darwin/*.app.tar.gz.sig; do
            add_platform "darwin-aarch64" "$sig" "${sig%.sig}"
          done
          for sig in _artifacts/picvert-x86_64-apple-darwin/*.app.tar.gz.sig; do
            add_platform "darwin-x86_64" "$sig" "${sig%.sig}"
          done
          for sig in _artifacts/picvert-x86_64-pc-windows-msvc/*.exe.sig; do
            add_platform "windows-x86_64" "$sig" "${sig%.sig}"
          done

          cat latest.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _artifacts/**/*
            latest.json
          generate_release_notes: true
          fail_on_unmatched_files: false
