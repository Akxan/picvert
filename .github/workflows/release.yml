name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14            # arm64
            target: aarch64-apple-darwin
            host_python: "3.12"
          - os: macos-13            # intel x86_64
            target: x86_64-apple-darwin
            host_python: "3.12"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            host_python: "3.12"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ─────────────────── Python sidecar build ───────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.host_python }}

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Python tests
        shell: bash
        run: pytest -q

      - name: Build picvert-engine binary (--onedir)
        shell: bash
        run: |
          # Builds dist/picvert-engine/  (folder layout — Tauri picks it up
          # from tauri.conf.json `bundle.resources`).
          python -m PyInstaller engine.spec --clean --noconfirm
          ls -la dist/picvert-engine | head

      # ─────────────────── Rust + Tauri build ───────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      # On macOS, import the Developer ID Application certificate from a
      # base64-encoded .p12 stored in repo secrets so cargo tauri build
      # can codesign + notarize. No-op on Windows / Linux runners.
      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/picvert-build.keychain-db
          KEYCHAIN_PWD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          # Make the build keychain the default search target.
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          # Verify codesign sees a usable Developer ID Application identity,
          # then export its SHA-1 — used as APPLE_SIGNING_IDENTITY in the
          # build step below. Bypasses any whitespace/encoding issues in
          # the secret value (codesign is picky about exact string match).
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          APPLE_ID_SHA=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$APPLE_ID_SHA" ]; then
            echo "::error::Developer ID Application identity not found in build keychain"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$APPLE_ID_SHA" >> $GITHUB_ENV

      # Tauri's bundler only signs Contents/MacOS/picvert. The PyInstaller
      # sidecar in Resources/engine ships dozens of Mach-O .so/.dylib files
      # — notarization rejects the .app unless every Mach-O inside it is
      # signed with the Developer ID + hardened runtime + secure timestamp.
      # PyInstaller does two things that interfere with notarization:
      #
      # 1. It rewrites Python.framework/Versions/X/Python's install_name
      #    from the canonical "@rpath/Python.framework/Versions/X/Python"
      #    to "@rpath/Python". dyld still loads it via rpath, but Apple's
      #    notarytool structural check rejects framework binaries that
      #    don't carry the framework path.
      #
      # 2. It ad-hoc-signs every embedded Mach-O with a junk identifier
      #    ("Python-<random hex>") instead of the bundle's
      #    CFBundleIdentifier (org.python.python). When we re-sign with
      #    Developer ID, codesign sometimes inherits this junk identifier,
      #    creating a mismatch with the framework Info.plist that the
      #    notary server validates.
      #
      # Fix both BEFORE our codesign step — install_name_tool and
      # --remove-signature both invalidate any existing signature, so
      # they must come first.
      - name: Repair PyInstaller framework artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          SIDECAR_DIR=dist/picvert-engine
          # Order matters: install_name_tool first (it refuses to touch a
          # binary that's been --remove-signature'd because that leaves an
          # empty LC_CODE_SIGNATURE block hanging at the end of __LINKEDIT
          # with no payload — link edit information does not fill the
          # __LINKEDIT segment).
          #
          # (1) Restore canonical framework install_names. Modifying the
          # binary invalidates any embedded ad-hoc signature.
          while IFS= read -r -d '' fw; do
            fwname=$(basename "$fw" .framework)
            for vdir in "$fw"/Versions/*/; do
              vdir="${vdir%/}"
              [ -L "$vdir" ] && continue
              binary="$vdir/$fwname"
              [ -f "$binary" ] || continue
              ver=$(basename "$vdir")
              new_id="@rpath/$(basename "$fw")/Versions/$ver/$fwname"
              echo "install_name_tool -id $new_id  ($binary)"
              install_name_tool -id "$new_id" "$binary"
            done
          done < <(find "$SIDECAR_DIR" -type d -name "*.framework" -print0)
          # (2) Now strip every ad-hoc signature so the codesign step
          # below starts from a clean slate (so it can't inherit
          # PyInstaller's junk "Python-<random>" identifier).
          stripped=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O"; then
              codesign --remove-signature "$f" 2>/dev/null || true
              stripped=$((stripped + 1))
            fi
          done < <(find "$SIDECAR_DIR" -type f -print0)
          echo "Stripped ad-hoc signatures: $stripped Mach-O files"

      - name: Sign Python sidecar binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          SIDECAR_DIR=dist/picvert-engine
          # Hardened runtime + Python: JIT/cffi allocate executable memory;
          # .so plugins are signed separately so library validation off.
          ENT="$RUNNER_TEMP/picvert-engine.entitlements"
          cat > "$ENT" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict>
          </plist>
          EOF
          SIGN_ARGS=(--force --options runtime --timestamp --entitlements "$ENT" \
                     --sign "$APPLE_SIGNING_IDENTITY")
          # Strip stale state — quarantine xattrs + leftover ad-hoc _CodeSignature
          # directories produced by PyInstaller that confuse the inside-out
          # framework-signing flow.
          xattr -cr "$SIDECAR_DIR"
          find "$SIDECAR_DIR" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          # Inside-out signing in three passes.
          # Pass 1 — all loose Mach-O (.so / .dylib / main binary), OUTSIDE
          #          any framework.
          loose=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O"; then
              codesign "${SIGN_ARGS[@]}" "$f"
              loose=$((loose + 1))
            fi
          done < <(find "$SIDECAR_DIR" -type f -not -path "*.framework/*" -print0)
          # Pass 2 — each framework Version directory (NOT the inner binary
          #          alone). codesign generates Versions/X/_CodeSignature/
          #          which seals the version's Mach-O + Resources/Info.plist
          #          as a unit. We must limit to direct children of Versions/
          #          (e.g. Versions/3.12) — NOT Versions/3.12/Resources or
          #          deeper. `-type d` also skips the Versions/Current
          #          symlink because BSD find's -type d uses lstat.
          ver=0
          while IFS= read -r -d '' d; do
            codesign "${SIGN_ARGS[@]}" "$d"
            ver=$((ver + 1))
          done < <(find "$SIDECAR_DIR" -type d -path "*.framework/Versions/*" \
                   -not -path "*.framework/Versions/*/*" -print0)
          # Pass 3 — each framework bundle (top level). Sets up
          #          Versions/Current symlink seal + outer Resources.
          fw=0
          while IFS= read -r -d '' d; do
            codesign "${SIGN_ARGS[@]}" "$d"
            fw=$((fw + 1))
          done < <(find "$SIDECAR_DIR" -type d -name "*.framework" -print0)
          # The two symlinks pointing at the framework's main binary
          # (_internal/Python and Python.framework/Python) keep failing
          # notarization with "signature of the binary is invalid" even
          # though the framework signs cleanly. Apple's notarytool walks
          # symlinks but evaluates each resulting path as a standalone
          # binary — without framework context, the Versions/X/Python
          # signature doesn't count for those paths.
          #
          # Replace the symlinks with hard copies of the now-signed
          # framework binary, then independently sign each copy. dyld
          # uses install_name (LC_ID_DYLIB) for actual loading, not the
          # path, so having two physical copies is fine.
          FW=$(find "$SIDECAR_DIR" -type d -name "Python.framework" | head -1)
          if [ -n "$FW" ]; then
            VER_BIN=$(find "$FW/Versions" -mindepth 2 -maxdepth 2 -type f -name "Python" | head -1)
            for victim in "$SIDECAR_DIR/_internal/Python" "$FW/Python"; do
              if [ -L "$victim" ]; then
                echo "De-symlinking $victim -> hard copy"
                rm "$victim"
                cp "$VER_BIN" "$victim"
                codesign "${SIGN_ARGS[@]}" "$victim"
              fi
            done
          fi
          echo "Signed: $loose loose + $ver version dirs + $fw frameworks (+ de-symlinked Python aliases)"
          # Local strict verification — must pass before letting Tauri proceed.
          codesign --verify --verbose=2 --strict "$SIDECAR_DIR/picvert-engine" 2>&1
          find "$SIDECAR_DIR" -type d -name "*.framework" -exec \
            codesign --verify --verbose=2 --strict --deep {} \;
          # Diagnostic dump — show framework signature internals so any
          # leftover Python.cstemp entry or identifier mismatch is visible.
          echo "===== Framework signature inspection ====="
          find "$SIDECAR_DIR" -type d -name "*.framework" | while read -r fw; do
            echo "--- $fw"
            codesign -dvvv "$fw" 2>&1 | head -10
            for v in "$fw"/Versions/*/; do
              v="${v%/}"
              [ -L "$v" ] && continue
              echo "--- $v/_CodeSignature/CodeResources files2:"
              plutil -p "$v/_CodeSignature/CodeResources" 2>&1 | awk '/"files2"/,/^  \}/' | head -20
            done
          done

      - name: Build Tauri bundle (sign only — manual notarize below)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # APPLE_SIGNING_IDENTITY is in $GITHUB_ENV (SHA-1 from keychain).
          # APPLE_ID / APPLE_PASSWORD intentionally NOT set so Tauri skips
          # notarization. We do that ourselves below to capture audit log.
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Notarize and capture audit log
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -e
          APP_PATH=$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          ZIP_PATH="$RUNNER_TEMP/Picvert-notarize.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          set +e
          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json > /tmp/notary.json
          NOTARY_EXIT=$?
          set -e
          cat /tmp/notary.json
          SUB_ID=$(jq -r '.id' /tmp/notary.json)
          STATUS=$(jq -r '.status' /tmp/notary.json)
          echo "Submission $SUB_ID → $STATUS"
          # Always pull audit log (succeeded or invalid) for visibility.
          xcrun notarytool log "$SUB_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            /tmp/audit.json || true
          echo "===== Audit log ====="
          cat /tmp/audit.json
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization status was $STATUS"
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"
          # Re-staple DMG too if present
          DMG_PATH=$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -name "*.dmg" 2>/dev/null | head -1 || true)
          if [ -n "$DMG_PATH" ]; then xcrun stapler staple "$DMG_PATH" || true; fi

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p _release
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg _release/ || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz _release/ || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig _release/ || true
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi _release/ || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe _release/ || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig _release/ || true
          fi
          ls -la _release

      - uses: actions/upload-artifact@v4
        with:
          name: picvert-${{ matrix.target }}
          path: _release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Generate latest.json (Tauri updater manifest)
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${TAG#v}"
          owner_repo="${{ github.repository }}"
          base="https://github.com/${owner_repo}/releases/download/${TAG}"
          notes=$(git log -1 --pretty=%B "$TAG" || echo "Release $TAG")

          # Tauri's updater format: per-platform URL + signature.
          # Sigs are produced by `cargo tauri build` next to each artifact.
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base "$base" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {}
            }' > latest.json

          # Helper to append a platform entry from the matching .sig file.
          add_platform() {
            local key="$1"
            local sig_file="$2"
            local pkg_file="$3"
            if [ -f "$sig_file" ] && [ -f "$pkg_file" ]; then
              sig=$(cat "$sig_file")
              pkg_name=$(basename "$pkg_file")
              jq --arg key "$key" \
                 --arg sig "$sig" \
                 --arg url "$base/$pkg_name" \
                 '.platforms[$key] = {signature: $sig, url: $url}' \
                 latest.json > latest.json.tmp && mv latest.json.tmp latest.json
            fi
          }

          shopt -s nullglob
          for sig in _artifacts/picvert-aarch64-apple-darwin/*.app.tar.gz.sig; do
            add_platform "darwin-aarch64" "$sig" "${sig%.sig}"
          done
          for sig in _artifacts/picvert-x86_64-apple-darwin/*.app.tar.gz.sig; do
            add_platform "darwin-x86_64" "$sig" "${sig%.sig}"
          done
          for sig in _artifacts/picvert-x86_64-pc-windows-msvc/*.exe.sig; do
            add_platform "windows-x86_64" "$sig" "${sig%.sig}"
          done

          cat latest.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _artifacts/**/*
            latest.json
          generate_release_notes: true
          fail_on_unmatched_files: false
