[package]
name = "picvert"
version = "1.1.0"
description = "Picvert — batch image / PDF / document converter"
authors = ["Julio (Akxan)"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "picvert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools feature stays on so Cmd+Opt+I still opens the inspector when we
# need to debug. The right-click "Inspect Element" / "Reload" context menu
# is suppressed by ui/main.js so production users don't see it.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["sync"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
