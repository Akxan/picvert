[package]
name = "picvert"
version = "1.1.0"
description = "Picvert — batch image / PDF / document converter"
authors = ["Julio (Akxan)"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "picvert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# - devtools: Cmd+Opt+I still opens the inspector when we need to debug
#   (right-click context menu is suppressed in JS for production users).
# - tray-icon: macOS menu-bar / Windows system-tray icon API.
# - macos-private-api: required for the transparent compact-mode window.
tauri = { version = "2", features = ["protocol-asset", "devtools", "tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["sync"] }
# Used by the http_get_text command — bypasses WKWebView CSP/CORS for the
# weather widget so it works on every user's network.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
