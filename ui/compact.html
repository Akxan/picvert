<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picvert</title>
    <link rel="stylesheet" href="compact.css" />
  </head>
  <body>
    <div
      id="capsule"
      role="button"
      tabindex="0"
      title="Drag to move · Click to expand"
      aria-label="Expand Picvert"
    >
      <span class="halo" aria-hidden="true"></span>
      <span class="glass" aria-hidden="true"></span>
      <svg
        class="capsule-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.55"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <!-- Two layered frames: source (outline) and target (subtly filled). -->
        <rect x="3.2" y="3.2" width="11.6" height="11.6" rx="2.6"></rect>
        <rect
          x="9.2"
          y="9.2"
          width="11.6"
          height="11.6"
          rx="2.6"
          fill="currentColor"
          fill-opacity="0.22"
          stroke="currentColor"
        ></rect>
      </svg>
      <span class="glint" aria-hidden="true"></span>
      <span class="ripple" aria-hidden="true"></span>
    </div>
    <script type="module" src="compact.js"></script>
  </body>
</html>
