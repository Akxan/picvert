<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picvert</title>
    <link rel="stylesheet" href="compact.css" />
  </head>
  <body>
    <div
      id="capsule"
      role="button"
      tabindex="0"
      aria-label="Click to expand Picvert"
      title="Drag to move · Click to expand"
    >
      <span class="card-glow" aria-hidden="true"></span>

      <!-- Left column: time + date + timezone -->
      <div class="col-time">
        <div id="time" class="time" aria-live="polite">--:--</div>
        <div id="date" class="date">—</div>
        <div id="tz" class="tz">—</div>
      </div>

      <div class="divider" aria-hidden="true"></div>

      <!-- Right column: weather + city + country -->
      <div class="col-weather">
        <div class="weather-row">
          <span id="weather-icon" class="weather-icon" aria-hidden="true"></span>
          <span id="temp" class="temp">—</span>
        </div>
        <div id="city" class="city">—</div>
        <div id="country" class="country">—</div>
      </div>

      <span class="ripple" aria-hidden="true"></span>
    </div>
    <script type="module" src="compact.js"></script>
  </body>
</html>
