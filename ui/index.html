<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picvert</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-row">
        <div>
          <h1 data-i18n="title">Picvert</h1>
          <p class="subtitle" data-i18n="subtitle">Batch image / PDF / document converter</p>
        </div>
        <div class="lang-picker">
          <label data-i18n="label_lang" for="lang-select">Language</label>
          <select id="lang-select"></select>
        </div>
      </div>
    </header>

    <main>
      <section id="dropzone" class="dropzone">
        <p class="dropzone-prompt" data-i18n="drop_prompt">Drop files here or click to select</p>
        <input id="file-input" type="file" multiple hidden />
      </section>

      <section class="controls">
        <label for="format-select" data-i18n="label_output_format">Output format:</label>
        <select id="format-select"></select>
        <button id="convert-btn" data-i18n="btn_convert">Start Conversion</button>
        <button id="clear-btn" data-i18n="btn_clear">Clear</button>
      </section>

      <section id="file-list" class="file-list">
        <p class="empty" data-i18n="list_empty">No files yet.</p>
      </section>

      <section id="progress" class="progress hidden">
        <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
        <p id="progress-text">0 / 0</p>
      </section>
    </main>

    <footer>
      <span id="version">v—</span>
      <span id="engine-status">Engine: …</span>
    </footer>

    <script type="module" src="main.js"></script>
  </body>
</html>
